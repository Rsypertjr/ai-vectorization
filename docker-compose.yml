version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16 
    container_name: enterprise_vector_db 
    environment:
      POSTGRES_DB: vector_enterprise 
      POSTGRES_USER: admin_user 
      POSTGRES_PASSWORD: secure_password_2026 
    ports:
      - "5432:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U admin_user -d vector_enterprise"]
      interval: 5s 
      timeout: 5s 
      retries: 5

  pgadmin:
    image: dpage/pgadmin4 
    container_name: vector_db_admin 
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@enterprise.com 
      PGADMIN_DEFAULT_PASSWORD: admin_password_2026 
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  pgdata:

